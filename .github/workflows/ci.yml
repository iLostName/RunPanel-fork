# Lint, types and the test suites that need no Docker, on every push and pull
# request of this repository.
#
# The suites that start a server run `next start` on the last build, so the
# build comes before them. Docker suites are skipped by `test:quick`
# (`--no-docker`); the PM2 ones skip themselves when PM2 is not installed, and
# the Postgres pass runs only where RUNPANEL_TEST_PG_URL is set — neither is
# here, on purpose: this job is the floor every change has to clear, not the
# whole matrix. The browser tests are the second job, `e2e`, once it passes.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      # The version the lockfile is written with: a newer one may rewrite it,
      # and --frozen-lockfile would then fail for a reason unrelated to the change.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # Node runs the panel, the build and the test runner. 24 is what the
      # suites need at least in practice: they load TypeScript files directly,
      # which plain Node does without flags from 22.18 on.
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      # The icon subset is generated from the names used in the code, and the
      # generator fails on a name that does not exist. `prebuild` runs it too;
      # spelled out so a missing icon is reported as such, before the build.
      - name: Icons
        run: bun run icons

      # `next-env.d.ts` and the route types are generated, not committed; without
      # them `tsc` cannot resolve image imports or typed routes.
      - name: Generate Next types
        run: npx next typegen

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Tests (no Docker)
        run: bun run test:quick

  # The browser tests (tests/e2e): the five flows, the shell on a phone, the
  # installable app and axe on the main pages, against a production build.
  # After `check`, so a change that fails the floor does not also pay for a
  # browser. The runner has Docker, so the project tests here follow the
  # deploy until the app is online; on a machine without it they stop where
  # the panel explains why it could not run.
  e2e:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      # Playwright's own Chromium and the system libraries it needs; locally
      # the tests use the installed Chrome instead (tests/e2e/playwright.config.ts).
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: End-to-end tests
        run: bun run test:e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          retention-days: 14
